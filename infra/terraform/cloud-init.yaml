#cloud-config
# Minimal first-boot hardening -- key-only SSH access, unattended
# security patches. Does NOT install k3s or anything app-specific;
# that's I1's job, run manually/via CI once the box exists.

package_update: true
package_upgrade: true

packages:
  - unattended-upgrades
  - fail2ban

ssh_pwauth: false

runcmd:
  - systemctl enable --now unattended-upgrades
  - systemctl enable --now fail2ban
